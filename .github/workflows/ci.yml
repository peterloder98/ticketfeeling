name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # No Docker — stays green even when Docker Hub / registry pulls time out.
  quality:
    runs-on: ubuntu-latest
    env:
      # Prisma generate does not need a live DB; placeholder keeps schema tooling happy.
      DATABASE_URL: postgresql://ticketfeeling:ticketfeeling@localhost:5432/ticketfeeling?schema=public
      NEXTAUTH_SECRET: ci-secret-ticketfeeling-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run db:generate -w web
      - run: npm run typecheck -w web
      - run: npm run lint -w web

  # Public HTTP smoke against production — no auth, no Stripe keys, no local DB.
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e -w web
        env:
          BASE_URL: https://ticketfeeling-web.vercel.app
          CI: "true"

  # Uses AWS Public ECR mirror of official Postgres (avoids flaky Docker Hub pulls).
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: ticketfeeling
          POSTGRES_PASSWORD: ticketfeeling
          POSTGRES_DB: ticketfeeling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketfeeling"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://ticketfeeling:ticketfeeling@localhost:5432/ticketfeeling?schema=public
      NEXTAUTH_SECRET: ci-secret-ticketfeeling-not-for-production
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run db:generate -w web
      - run: npm run db:migrate:deploy -w web
